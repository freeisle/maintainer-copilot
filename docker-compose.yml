services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: mc-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintainer_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 可选: 本地 LLM 兜底(断网演示不翻车)
  # ollama:
  #   image: ollama/ollama
  #   ports:
  #     - "11434:11434"
