  #     - ollama:/root/.ollama

  # 可选: 评测追踪面板(Sprint 2 有余力再上, 自托管 Langfuse)
  # langfuse:
  #   image: langfuse/langfuse:latest
  #   ports:
  #     - "3000:3000"

volumes:
  pgdata:
